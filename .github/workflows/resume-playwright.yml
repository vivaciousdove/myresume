
name: Resume Site - Playwright Quality Gate

on:
  push:
    paths:
      - "myresume/**"
      - ".github/workflows/resume-playwright.yml"
  pull_request:
    paths:
      - "myresume/**"
      - ".github/workflows/resume-playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myresume

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: myresume/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Start a local server so Playwright hits http://127.0.0.1:5173/
      # This uses Playwright's webServer config via CLI arg (no extra config file required).
      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Helpful to keep logs consistent in CI
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: myresume/playwright-report
          if-no-files-found: warn

      - name: Upload test results (traces/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: myresume/test-results
          if-no-files-found: warn
