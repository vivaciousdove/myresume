
name: Resume Site - Playwright Quality Gate

on:
  push:
    # Run only when resume site or workflow changes
    paths:
      - "**" # <-- safest while you stabilize; tighten later if you want
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ✅ IMPORTANT: Your repo IS the resume site (repo name is myresume)
      # There is NO "myresume/" subfolder on the runner.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: "true"

      # ✅ Artifacts live at repo root (default Playwright output folders)
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload test results (traces/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
